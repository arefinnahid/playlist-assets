<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Embedded Google Font for Bengali typography -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@700;900&amp;display=swap');
      
      .main-title {
        font-family: 'Noto Sans Bengali', 'Tiro Bangla', 'Kalpurush', sans-serif;
        font-weight: 900;
        fill: #FFFFFF;
        font-size: 82px;
        filter: drop-shadow(2px 3px 3px rgba(0,0,0,0.6));
      }
      
      .sub-title {
        font-family: 'Noto Sans Bengali', 'Tiro Bangla', 'Kalpurush', sans-serif;
        font-weight: 700;
        fill: #FFFFFF;
        font-size: 30px;
        letter-spacing: 0.5px;
        filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.5));
      }
      
      .num-text {
        font-family: 'Impact', 'Arial Black', sans-serif;
        font-weight: 900;
        fill: #FFFFFF;
        font-size: 115px;
        font-style: italic;
      }
      
      .tv-text {
        font-family: 'Arial Black', sans-serif;
        font-weight: 900;
        fill: #FFFFFF;
        font-size: 34px;
        letter-spacing: 2px;
      }
    </style>

    <!-- Main Red Banner Gradient -->
    <linearGradient id="bannerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C62828" />
      <stop offset="40%" stop-color="#B71C1C" />
      <stop offset="100%" stop-color="#4A0000" />
    </linearGradient>

    <!-- Metallic Silver Edge Gradient -->
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#E0E0E0" />
      <stop offset="50%" stop-color="#757575" />
      <stop offset="80%" stop-color="#D6D6D6" />
      <stop offset="100%" stop-color="#333333" />
    </linearGradient>

    <!-- Circle Top Red Gradient -->
    <linearGradient id="circleRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D32F2F" />
      <stop offset="100%" stop-color="#8E0000" />
    </linearGradient>

    <!-- Outer Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Main Banner Capsule -->
  <g filter="url(#shadow)">
    <path d="M 110 90 
             L 730 90 
             A 90 90 0 0 1 730 270 
             L 110 270 
             A 90 90 0 0 1 110 90 Z" 
          fill="url(#bannerGradient)" />
    
    <!-- Geometric Overlay Highlight Pattern -->
    <path d="M 50 180 L 140 90 L 730 90 L 640 180 Z" fill="#FFFFFF" opacity="0.06" />
  </g>

  <!-- Bengali Text Elements -->
  <g>
    <!-- Main Header: বিশ্ব বাংলা -->
    <text x="135" y="200" class="main-title">বিশ্ব বাংলা</text>
    
    <!-- Subtitle: বিশ্বায়নে বাঙালিয়ানা -->
    <text x="355" y="248" class="sub-title">বিশ্বায়নে বাঙালিয়ানা</text>
  </g>

  <!-- Right Circular "24 TV" Badge -->
  <g transform="translate(765, 180)" filter="url(#shadow)">
    <!-- Outer Metallic Ring -->
    <circle cx="0" cy="0" r="110" fill="url(#silverGradient)" />
    <!-- Inner Dark Border Edge -->
    <circle cx="0" cy="0" r="98" fill="#1A1A1A" />

    <!-- Upper Half Red Background -->
    <path d="M -98 0 A 98 98 0 0 1 98 0 L -98 0 Z" fill="url(#circleRed)" />
    
    <!-- Lower Half Dark Gray/Black Background -->
    <path d="M -98 0 A 98 98 0 0 0 98 0 L -98 0 Z" fill="#181818" />

    <!-- Center Dividing Line -->
    <line x1="-98" y1="0" x2="98" y2="0" stroke="#000000" stroke-width="2.5" />

    <!-- "24" Large Number -->
    <text x="-6" y="24" class="num-text" text-anchor="middle">24</text>
    
    <!-- "TV" Subtext -->
    <text x="0" y="68" class="tv-text" text-anchor="middle">TV</text>
  </g>
</svg>
